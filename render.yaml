services:
  - type: web
    name: lendtrack-api-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://lendtrack-api-demo.onrender.com
      - key: AUTH_REGISTRATION_ENABLED
        value: "false"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: lendtrack-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: lendtrack-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: lendtrack-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: lendtrack-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: lendtrack-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

databases:
  - name: lendtrack-db
    plan: free
    databaseName: lendtrack
    user: lendtrack
