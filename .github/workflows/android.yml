
name: Build LendTrack Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: ionic-app
        run: npm ci

      - name: Build web application
        working-directory: ionic-app
        run: npm run build

      - name: Sync Android
        working-directory: ionic-app
        run: npx cap sync android

      - name: Build APK
        working-directory: ionic-app/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LendTrack-APK
          path: ionic-app/android/app/build/outputs/apk/debug/app-debug.apk
